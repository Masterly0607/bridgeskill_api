version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: bridgeskill-postgres
    restart: always
    environment:
      POSTGRES_DB: bridgeskill
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - bridgeskill_pgdata:/var/lib/postgresql/data

volumes:
  bridgeskill_pgdata: